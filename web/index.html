<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一生图网关 · 控制台</title>
<style>
  :root{
    --nav:#0f1f33; --nav2:#16293f; --primary:#2563eb; --ink:#1f2937;
    --muted:#6b7686; --line:#e4e9f0; --bg:#edf0f5; --ok:#16a34a;
    --warn:#d97706; --card-shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px}
  a{color:var(--primary);text-decoration:none}

  /* ---------- 顶栏 ---------- */
  .topbar{height:56px;background:var(--nav);color:#fff;display:flex;align-items:center;
    padding:0 20px;gap:18px;position:sticky;top:0;z-index:20}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;min-width:208px}
  .brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#22d3ee);
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .topbar .grow{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);
    border-radius:20px;padding:5px 12px;font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  .dot.g{background:var(--ok)}.dot.a{background:#94a3b8}.dot.c{background:var(--warn)}
  .topbar select{width:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
    border-radius:7px;padding:6px 8px;font-size:12.5px}
  .topbar select option{color:#1f2937}
  .topbar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:7px;
    padding:6px 11px;font-size:12.5px;cursor:pointer}

  /* ---------- 布局 ---------- */
  .shell{display:grid;grid-template-columns:208px 1fr;min-height:calc(100vh - 56px)}
  .sidenav{background:var(--nav2);padding:14px 12px}
  .navitem{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;color:#b8c4d4;
    font-size:13.5px;cursor:pointer;margin-bottom:4px;font-weight:500}
  .navitem .ic{width:18px;text-align:center}
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff}
  .navitem.on{background:var(--primary);color:#fff}
  .navsec{font-size:11px;color:#5f718a;text-transform:uppercase;letter-spacing:.8px;margin:14px 13px 7px}

  .main{padding:20px 22px;min-width:0}
  .view{display:none}.view.on{display:block}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--card-shadow)}
  .card .ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .card .ch h3{font-size:15px;font-weight:650}
  .card .cb{padding:18px}

  /* ---------- 表单 ---------- */
  .fld{margin-bottom:14px}.fld>span{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px;color:#374151}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd8e3;border-radius:8px;
    font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:84px;line-height:1.55}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .subtabs{display:flex;gap:5px;background:#eef2f7;border-radius:9px;padding:4px;margin-bottom:16px}
  .subtabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;
    font-size:13px;color:#5b6675}
  .subtabs button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .checklist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .checklist label{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;cursor:pointer}
  .checklist input{width:auto}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;
    border-radius:8px;border:1px solid #cfd8e3;background:#f1f5fa;font-size:13.5px;cursor:pointer;font-weight:600;color:#334155}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}
  .btn.block{width:100%;padding:12px;font-size:14.5px}
  .btn:disabled{opacity:.6;cursor:wait}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px}
  .b-free{background:#e6f7ee;color:#0f8a4a}.b-quota{background:#e8f1ff;color:#1d5fd0}
  .b-cheap{background:#fdf0dd;color:#b45309}.b-paid{background:#f3e9ff;color:#7c3aed}
  .b-relay{background:#e6ecf5;color:#475569}.b-up{background:#e7eefc;color:#23528f}
  .b-act{background:#eef2f7;color:#5b6675}

  /* workbench grid */
  .wb{display:grid;grid-template-columns:388px 1fr;gap:18px;align-items:start}
  .resultgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .fig{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .fig img{width:100%;display:block;cursor:zoom-in}
  .fig .fm{padding:9px 11px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
  .fig .fm a{font-weight:650}
  .empty{border:1.5px dashed #cbd5e1;border-radius:11px;padding:46px;text-align:center;color:#94a3b8;font-size:13.5px}

  /* stat cards */
  .statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px;box-shadow:var(--card-shadow)}
  .stat .n{font-size:26px;font-weight:750;line-height:1.1}
  .stat .t{font-size:12.5px;color:var(--muted);margin-top:5px}
  .stat.s1 .n{color:var(--ok)}.stat.s2 .n{color:#64748b}.stat.s3 .n{color:var(--warn)}.stat.s4 .n{color:var(--primary)}

  /* provider management */
  .provgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(392px,1fr));gap:16px}
  .pcard .ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .pcard .ph .nm{font-weight:700;font-size:14.5px}
  .pcard .ph .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .pcard .pb{padding:14px 16px}
  .pcard .desc{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
  .pcard .crow{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .pcard .crow label{font-size:12px;color:#475569;width:74px;flex-shrink:0}
  .switch{position:relative;width:40px;height:22px;flex-shrink:0}
  .switch input{display:none}
  .switch .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;cursor:pointer;transition:.2s}
  .switch .sl:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.sl{background:var(--ok)}
  .switch input:checked+.sl:before{transform:translateX(18px)}
  .pcard .pfoot{display:flex;gap:9px;padding:0 16px 14px}
  .selftest{font-size:12px;padding:7px 10px}

  /* history */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar input{width:230px}.toolbar select{width:160px}
  .hrec{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:13px;
    box-shadow:var(--card-shadow);display:grid;grid-template-columns:1fr auto;gap:14px}
  .hrec .hleft{min-width:0}
  .hrec .hline1{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .chan-badge{font-size:13px;font-weight:750;padding:4px 11px;border-radius:8px}
  .hrec .pr{font-weight:650;font-size:14px;margin-bottom:6px;line-height:1.45}
  .hrec .meta{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .hrec .thumbs{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start}
  .hrec .thumbs img{height:104px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  .hrec .ops{display:flex;gap:13px;font-size:12.5px;margin-top:9px}
  .hrec .ops a{font-weight:650;cursor:pointer}

  .msg{padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px}
  .msg.ok{background:#e9f8f0;color:#117a43;border:1px solid #bfe6cf}
  .msg.err{background:#fdecec;color:#b42318;border:1px solid #f4c0c0}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--primary);
    border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes rot{to{transform:rotate(360deg)}}

  #lightbox{position:fixed;inset:0;background:rgba(10,16,24,.86);display:none;align-items:center;justify-content:center;z-index:99}
  #lightbox img{max-width:94vw;max-height:92vh;border-radius:8px}
  details.howto{background:#e7eef6;border-bottom:1px solid var(--line);padding:10px 22px}
  details.howto summary{cursor:pointer;font-weight:650;color:#16324f;font-size:13px}
  details.howto pre{background:#111c2c;color:#cfe0f2;padding:13px;border-radius:8px;margin-top:10px;overflow:auto;font-size:12px;line-height:1.65}
  .logtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .logtable th{text-align:left;padding:9px 10px;background:#f6f8fb;color:#5b6675;
    font-weight:650;border-bottom:1px solid var(--line);position:sticky;top:0}
  .logtable td{padding:9px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}
  .logtable tr:hover td{background:#f8fafc}
  .logtable .prompt{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569}
  .st-ok{color:var(--ok);font-weight:650}.st-fail{color:#dc2626;font-weight:650}
  .tbadge{font-size:11px;padding:2px 7px;border-radius:10px;background:#eef2f7;color:#475569;font-weight:600}
  .tbadge.mcp{background:#ede9fe;color:#6d28d9}.tbadge.api{background:#e0f2fe;color:#0369a1}
  .tbadge.cli{background:#fef3c7;color:#92400e}.tbadge.web{background:#dcfce7;color:#15803d}
  @media(max-width:980px){.wb{grid-template-columns:1fr}.statrow{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.sidenav{display:flex;overflow:auto}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="logo">◆</span>统一生图网关</div>
  <span class="pill"><span class="dot g" id="globalDot"></span><span id="globalTxt">—</span></span>
  <div class="grow"></div>
  <span class="pill">当前会话</span>
  <select id="sessSel"></select>
  <button id="sessNew">+ 新建会话</button>
  <input id="adminTokenInput" type="password" placeholder="admin token" autocomplete="off"
    style="width:130px;margin-left:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:5px 8px;font-size:12px"
    title="网关配置 admin_token 后在此填入，前端所有请求自动携带 X-Admin-Token（存本地浏览器）">
</div>

<div class="shell">
  <nav class="sidenav">
    <div class="navsec">工作区</div>
    <div class="navitem on" data-view="workbench"><span class="ic">🎨</span>出图工作台</div>
    <div class="navitem" data-view="history"><span class="ic">🗂️</span>历史记录</div>
    <div class="navsec">系统</div>
    <div class="navitem" data-view="providers"><span class="ic">🔌</span>渠道管理</div>
    <div class="navitem" data-view="clients"><span class="ic">📊</span>接入方与日志</div>
    <div class="navitem" data-view="api"><span class="ic">📡</span>接入文档</div>
  </nav>

  <div class="main">

    <!-- ============ 工作台 ============ -->
    <div class="view on" id="view-workbench">
      <div class="wb">
        <div class="card">
          <div class="ch"><h3>生成参数</h3></div>
          <div class="cb">
            <div class="subtabs">
              <button data-w="single" class="on">单渠道</button>
              <button data-w="auto">自动链</button>
              <button data-w="compare">多渠道对比</button>
            </div>

            <div id="w-single">
              <div class="fld"><span>选择第三方渠道 / 模型</span><select id="singleSel"></select></div>
            </div>
            <div id="w-auto" style="display:none">
              <div id="chainBox" style="font-size:12.5px;line-height:1.9;color:#475569"></div>
            </div>
            <div id="w-compare" style="display:none">
              <span style="font-size:12.5px;font-weight:650;display:block;margin-bottom:7px">勾选要并排对比的渠道（最多5）</span>
              <div class="checklist" id="cmpList"></div>
            </div>

            <div class="fld" style="margin-top:14px"><span>提示词 Prompt</span>
              <textarea id="prompt" placeholder="详细描述你想要的画面主体、风格、光线、构图"></textarea></div>
            <div class="fld"><span>负向提示词（可选）</span><input id="negative" placeholder="不希望出现的元素"></div>
            <div class="g2">
              <div class="fld"><span>尺寸 WxH</span><input id="size" value="1024x1024"></div>
              <div class="fld"><span>数量 n（≤8）</span><input id="n" type="number" value="1" min="1" max="8"></div>
            </div>
            <div class="fld"><span>随机种子（可选）</span><input id="seed" type="number" placeholder="留空随机"></div>
            <button class="btn primary block" id="goBtn">开始生成</button>
          </div>
        </div>

        <div>
          <div id="wbMsg"></div>
          <div class="card">
            <div class="ch"><h3>生成结果</h3><span style="font-size:12.5px;color:var(--muted)" id="resInfo"></span></div>
            <div class="cb">
              <div class="resultgrid" id="grid"></div>
              <div class="empty" id="resEmpty">结果会显示在这里；点击图片可放大</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ 历史 ============ -->
    <div class="view" id="view-history">
      <div class="card">
        <div class="ch"><h3>历史记录</h3><span style="font-size:12.5px;color:var(--muted)" id="hCount"></span></div>
        <div class="cb">
          <div class="toolbar">
            <input id="hSearch" placeholder="按提示词 / 渠道名搜索">
            <select id="hSort">
              <option value="ts_desc">时间 · 最新优先</option>
              <option value="ts_asc">时间 · 最早优先</option>
              <option value="provider_asc">渠道名 A→Z</option>
              <option value="provider_desc">渠道名 Z→A</option>
              <option value="size_desc">尺寸 大→小</option>
              <option value="n_desc">数量 多→少</option>
            </select>
            <button class="btn" id="hRefresh">刷新</button>
            <button class="btn primary" id="hUpload">上传图片到当前会话</button>
            <input type="file" id="hFile" accept="image/*" style="display:none">
          </div>
          <div id="histList"></div>
        </div>
      </div>
    </div>

    <!-- ============ 渠道管理 ============ -->
    <div class="view" id="view-providers">
      <div class="statrow">
        <div class="stat s1"><div class="n" id="stAv">0</div><div class="t">可用渠道</div></div>
        <div class="stat s2"><div class="n" id="stUn">0</div><div class="t">未配置 / 未启用</div></div>
        <div class="stat s3"><div class="n" id="stCo">0</div><div class="t">冷却中</div></div>
        <div class="stat s4"><div class="n" id="stTo">0</div><div class="t">渠道总数</div></div>
      </div>
      <div id="provMsg"></div>
      <div class="provgrid" id="provGrid"></div>
    </div>

    <!-- ============ 接入方与日志 ============ -->
    <div class="view" id="view-clients">
      <div class="card" style="margin-bottom:16px">
        <div class="ch"><h3>接入方</h3><span style="font-size:12.5px;color:var(--muted)" id="cliCount"></span></div>
        <div class="cb"><div class="statrow" id="cliCards" style="margin-bottom:0"></div></div>
      </div>
      <div class="card">
        <div class="ch"><h3>使用日志</h3>
          <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
            <select id="logClient" style="width:auto"><option value="">全部接入方</option></select>
            <select id="logTransport" style="width:auto">
              <option value="">全部通道</option><option value="api">API</option>
              <option value="mcp">MCP</option><option value="cli">CLI</option><option value="web">Web</option>
            </select>
            <select id="logAction" style="width:auto">
              <option value="">全部动作</option><option value="generate">生成</option>
              <option value="compare">对比</option><option value="configure">配置</option>
              <option value="upload">上传</option><option value="test">自检</option>
              <option value="heartbeat">心跳</option>
            </select>
            <select id="logLimit" style="width:auto">
              <option value="50">50条</option><option value="100">100条</option>
              <option value="300" selected>300条</option><option value="1000">1000条</option>
            </select>
            <input id="logSearch" placeholder="搜索 prompt/渠道" style="width:180px">
            <button class="btn" id="logRefresh">刷新</button>
            <label style="font-size:12.5px;color:var(--muted);margin-left:8px;cursor:pointer">
              <input type="checkbox" id="logAutoRefresh"> 自动刷新
            </label>
            <button class="btn" id="logClear" style="margin-left:8px">清空显示</button>
          </div>
        </div>
        <div class="cb" style="padding-top:0">
          <div class="logtable" id="logTable"></div>
        </div>
      </div>
    </div>

    <!-- ============ 接入文档 ============ -->
    <div class="view" id="view-api">
      <div class="card"><div class="ch"><h3>给其他 AI Agent / 程序的接入方式</h3></div>
        <div class="cb"><pre id="apiPre" style="font-size:12.5px;line-height:1.7;white-space:pre-wrap"></pre></div></div>
    </div>

  </div>
</div>

<div id="lightbox"><img id="lbImg"></div>

<script>
const $=id=>document.getElementById(id);
function apiFetch(url, opts){
  opts = opts||{};
  var h = {"X-Transport":"web","X-Client-Name":"web-console"};
  var adminToken = localStorage.getItem('imgw_admin_token');
  if(adminToken) h['X-Admin-Token'] = adminToken;
  if(opts.headers){ for(var k in opts.headers) h[k]=opts.headers[k]; }
  opts.headers = h;
  return fetch(url, opts);
}
let MODELS=[],PROVIDERS=[],WT='single',CUR_SID='default',busy=false,ctrl=null,hbTimer=null;
function startHeartbeat(){
  stopHeartbeat();
  apiFetch('/v1/heartbeat');
  hbTimer=setInterval(function(){apiFetch('/v1/heartbeat');},60000);
}
function stopHeartbeat(){if(hbTimer){clearInterval(hbTimer);hbTimer=null;}}

/* ---------------- 会话 ---------------- */
async function loadSessions(keep){
  const d=await(await apiFetch('/v1/sessions')).json();
  const sel=$('sessSel');sel.innerHTML='';
  d.data.forEach(s=>{const o=document.createElement('option');o.value=s.id;
    o.textContent=s.title+' · '+s.images+'图';sel.appendChild(o);});
  CUR_SID=keep||localStorage.getItem('imgw_sid')||'default';
  if(!d.data.some(s=>s.id===CUR_SID))CUR_SID='default';
  sel.value=CUR_SID;localStorage.setItem('imgw_sid',CUR_SID);
}
$('sessSel').onchange=async e=>{CUR_SID=e.target.value;localStorage.setItem('imgw_sid',CUR_SID);
  if($('view-history').classList.contains('on'))loadHistory();};
$('sessNew').onclick=async()=>{const t=prompt('新会话标题（可留空）','')||'';
  const s=await(await apiFetch('/v1/sessions',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:t})})).json();
  await loadSessions(s.id);if($('view-history').classList.contains('on'))loadHistory();};

/* ---------------- 导航 ---------------- */
document.querySelectorAll('.navitem').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('on'));n.classList.add('on');
  const v=n.dataset.view;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $('view-'+v).classList.add('on');
  if(v==='history')loadHistory();
  if(v==='providers')loadProviders();
  if(v==='clients'){loadClients();loadUsage();startHeartbeat();}
  else stopHeartbeat();
});

/* ---------------- 初始化 ---------------- */
async function init(){
  var savedToken = localStorage.getItem('imgw_admin_token');
  if(savedToken) $('adminTokenInput').value = savedToken;
  MODELS=(await(await apiFetch('/v1/models')).json()).data;
  try{PROVIDERS=(await(await apiFetch('/v1/providers')).json()).data;}catch(e){}
  fillSingle();fillCompare();fillApi();
  await loadSessions();refreshChain();setInterval(refreshChain,3000);
  refreshGlobal();setInterval(refreshGlobal,5000);
}
function fillSingle(){const s=$('singleSel');s.innerHTML='';
  MODELS.forEach(m=>{const o=document.createElement('option');o.value=m.id;
    o.textContent=m.id+(m.available?'':'（未配置）');if(!m.available)o.style.color='#9aa5b1';s.appendChild(o);});}
function fillCompare(){const box=$('cmpList');box.innerHTML='';const seen={};
  MODELS.forEach(m=>{const p=m.id.split('/')[0];if(seen[p])return;seen[p]=1;
    const lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.value=m.id;
    const b=document.createElement('span');b.className='badge '+(m.available?(m.kind==='free'?'b-free':'b-cheap'):'b-act');
    b.textContent=m.available?(m.kind==='free'?'免费':'需key'):'未配置';
    lab.append(cb,document.createTextNode(p),b);box.appendChild(lab);});}
async function refreshChain(){
  try{const j=await(await apiFetch('/v1/chain')).json();let h='<div>自动链顺序（成功即止）：</div><ol style="padding-left:18px">';
    j.chain.forEach((x,i)=>h+='<li>'+x+(i===0?'（最先）':'')+'</li>');h+='</ol>';
    if(j.cooling.length){h+='<div style="color:#b45309">冷却中：'+j.cooling.map(c=>c.provider+'('+c.left+'s)').join('、')+'</div>';}
    $('chainBox').innerHTML=h;
  }catch(e){}
}
async function refreshGlobal(){
  try{const j=await(await apiFetch('/v1/providers')).json();const s=j.summary;
    $('globalTxt').textContent=s.available+'/'+s.total+' 渠道可用';
    $('globalDot').className='dot '+(s.available?'g':'a');

/* ---------------- 工作台子tab ---------------- */
document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{
  WT=b.dataset.w;
  document.querySelectorAll('.subtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  ['single','auto','compare'].forEach(k=>$('w-'+k).style.display=WT===k?'block':'none');
});

/* ---------------- 生成 ---------------- */
$('goBtn').onclick=async()=>{
  if(busy){if(ctrl)ctrl.abort();return;}
  const prompt=$('prompt').value.trim();if(!prompt){alert('请输入提示词');return;}
  const c={prompt,negative_prompt:$('negative').value.trim(),
    size:$('size').value.trim()||'1024x1024',n:parseInt($('n').value)||1,
    response_format:'b64_json',session_id:CUR_SID};
  const seed=$('seed').value;if(seed)c.seed=parseInt(seed);
  let url;
  if(WT==='compare'){const t=[...document.querySelectorAll('#cmpList input:checked')].map(x=>x.value);
    if(!t.length){alert('请至少勾选一个渠道');return;}c.model=t.slice(0,5);url='/v1/images/compare';}
  else{c.model=WT==='auto'?'auto':$('singleSel').value;url='/v1/images/generations';}
  setBusy(1);$('grid').innerHTML='';$('wbMsg').innerHTML='';$('resEmpty').style.display='block';
  ctrl=new AbortController();
  try{
    const r=await apiFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(c),signal:ctrl.signal});
    const j=await r.json();
    if(url.endsWith('compare')){(j.results||[]).forEach(renderCmp);}
    else if(r.ok){$('resInfo').textContent='渠道 '+j.provider+' · 会话 '+j.session_id;
      j.data.forEach(d=>{const m=b64mime(d.b64_json);
        addFig('data:'+m+';base64,'+d.b64_json,j.provider,m);});}
    else failMsg(j.error&&j.error.message);
  }catch(e){if(e.name==='AbortError'){}else failMsg('请求异常: '+e.message);}
  finally{setBusy(0);ctrl=null;loadSessions(CUR_SID);};
};
function failMsg(m){$('wbMsg').innerHTML='<div class="msg err">'+m+'</div>';$('resInfo').textContent='';}
function renderCmp(r){
  if(!r.ok){failMsg(r.target+' 失败: '+r.error);}
  else{const m='image/'+(r.ext==='jpg'?'jpeg':r.ext);addFig('data:'+m+';base64,'+r.b64,r.target,m);}}
function addFig(src,name,mime){$('resEmpty').style.display='none';
  const fig=document.createElement('div');fig.className='fig';
  const im=document.createElement('img');im.src=src;im.onclick=()=>openLb(src);
  const fm=document.createElement('div');fm.className='fm';
  const sp=document.createElement('span');sp.textContent=name;
  const a=document.createElement('a');a.href=src;
  a.download=name.replace(/[\/\\]/g,'_')+'.'+(MIME_EXT[mime]||'png');
  a.textContent='下载';
  fm.append(sp,a);fig.append(im,fm);$('grid').appendChild(fig);}
function setBusy(b){busy=b;const btn=$('goBtn');btn.textContent=b?'取消':'开始生成';
  btn.classList.toggle('danger',b);if(b)$('resInfo').innerHTML='<span class="spin"></span>处理中…';}

function b64mime(b){try{const x=atob(b.slice(0,16)),a=x.charCodeAt(0),z=x.charCodeAt(1);
  if(a===0xFF&&z===0xD8)return'image/jpeg';if(a===0x89&&z===0x50)return'image/png';
  if(a===0x52&&z===0x49)return'image/webp';}catch(e){}return'image/png';}
const MIME_EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};

/* ---------------- 历史 ---------------- */
async function loadHistory(){
  const s=$('hSearch').value.trim(),sort=$('hSort').value;
  $('histList').innerHTML='<span class="spin"></span>加载中…';
  const q='/v1/sessions/'+CUR_SID+'/history?search='+encodeURIComponent(s)+'&sort='+sort;
  const j=await(await apiFetch(q)).json();
  $('hCount').textContent='共 '+j.total+' 条 · 会话 '+CUR_SID;
  if(!j.total){$('histList').innerHTML='<div class="empty">没有匹配记录</div>';return;}
  $('histList').innerHTML='';
  j.data.forEach(r=>$('histList').appendChild(renderHRec(r)));
}
function typeBadgeClass(t){return {'free':'b-free','quota':'b-quota','cheap':'b-cheap','paid':'b-paid','relay':'b-relay'}[t]||'b-act';}
function renderHRec(r){
  const d=document.createElement('div');d.className='hrec';
  const left=document.createElement('div');left.className='hleft';
  const l1=document.createElement('div');l1.className='hline1';
  // 显著第三方渠道名
  const cb=document.createElement('span');
  if(r.source==='upload'){cb.className='chan-badge b-up';cb.textContent='本地上传';}
  else{cb.className='chan-badge '+typeBadgeClass(providerType(r.provider));cb.textContent=r.provider;}
  const act=document.createElement('span');act.className='badge b-act';
  act.textContent=r.source==='upload'?'上传':'生成';
  l1.append(cb,act);
  const pr=document.createElement('div');pr.className='pr';pr.textContent=r.prompt||'(无提示词)';
  const mt=document.createElement('div');mt.className='meta';
  mt.innerHTML='<span>🕐 '+fmtT(r.ts)+'</span>'+(r.width?'<span>📐 '+r.width+'×'+r.height+'</span>':'')+
    '<span>🖼 n='+r.n+'</span>'+(r.seed!=null?'<span>seed='+r.seed+'</span>':'')+'<span>💾 '+Math.round((r.bytes||0)/1024)+'KB</span>';
  left.append(l1,pr,mt);
  const right=document.createElement('div');
  const th=document.createElement('div');th.className='thumbs';
  r.file_urls.forEach((u,i)=>{const im=document.createElement('img');im.src=u;im.onclick=()=>openLb(r.file_urls[i]);th.appendChild(im);});
  const ops=document.createElement('div');ops.className='ops';
  const a1=document.createElement('a');a1.textContent='↻ 用此参数重生成';a1.onclick=()=>reuse(r);
  const a2=document.createElement('a');a2.textContent='下载';a2.href=r.file_urls[0]||'#';
  ops.append(a1,a2);right.append(th,ops);
  d.append(left,right);return d;
}
/* 渠道名 -> 类型（从 providers 状态查） */
function providerType(name){const p=PROVIDERS.find(x=>x.name===name);return p?p.type:'free';}
function reuse(r){
  $('prompt').value=r.prompt||'';$('negative').value=r.negative||'';
  if(r.width)$('size').value=r.width+'x'+r.height;
  $('n').value=1;$('seed').value=r.seed!=null?r.seed:'';
  document.querySelector('.navitem[data-view="workbench"]').click();
  if(r.source!=='upload'){const o=[...$('singleSel').options].find(x=>x.value.split('/')[0]===r.provider);
    if(o){document.querySelector('.subtabs button[data-w="single"]').click();$('singleSel').value=o.value;}}
  else document.querySelector('.subtabs button[data-w="auto"]').click();
  window.scrollTo({top:0});
}
$('hSearch').oninput=deb(loadHistory,350);$('hSort').onchange=loadHistory;
$('hRefresh').onclick=loadHistory;
$('hUpload').onclick=()=>$('hFile').click();
$('hFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const cap=prompt('备注（可留空）','')||'';const fd=new FormData();
  fd.append('file',f);fd.append('caption',cap);
  const r=await apiFetch('/v1/sessions/'+CUR_SID+'/upload',{method:'POST',body:fd});
  if(!r.ok){alert('上传失败');return;}e.target.value='';loadSessions(CUR_SID);loadHistory();};

/* ---------------- 渠道管理 ---------------- */
async function loadProviders(){
  $('provGrid').innerHTML='<span class="spin"></span>加载中…';
  const j=await(await apiFetch('/v1/providers')).json();PROVIDERS=j.data;
  const s=j.summary;
  $('stAv').textContent=s.available;$('stUn').textContent=s.unconfigured;
  $('stCo').textContent=s.cooling;$('stTo').textContent=s.total;
  $('provGrid').innerHTML='';
  j.data.forEach(p=>$('provGrid').appendChild(renderP(p)));
}
function renderP(p){
  const c=document.createElement('div');c.className='card pcard';
  const ph=document.createElement('div');ph.className='ph';
  const nm=document.createElement('span');nm.className='nm';nm.textContent=p.label;
  const tb=document.createElement('span');tb.className='badge '+typeBadgeClass(p.type);tb.textContent=p.type_label;
  const st=document.createElement('span');st.className='st';
  const sd=document.createElement('span');sd.className='dot '+(p.available?'g':(p.cooldown_left?'c':'a'));
  st.append(sd,document.createTextNode(p.available?'可用':(p.cooldown_left?'冷却 '+p.cooldown_left+'s':'未配置')));
  ph.append(nm,tb,st);
  const pb=document.createElement('div');pb.className='pb';
  const ds=document.createElement('div');ds.className='desc';ds.textContent=p.desc+(p.url?' · ':"");
  pb.appendChild(ds);
  // 凭证
  p.creds.forEach(cr=>{const row=document.createElement('div');row.className='crow';
    const lb=document.createElement('label');lb.textContent=cr.label;
    const inp=document.createElement('input');inp.type='password';inp.dataset.f=cr.field;
    inp.placeholder=(cr.set?'已设置 · 留空不修改':'未设置'+(cr.optional?'（可选）':''));
    row.append(lb,inp);pb.appendChild(row);});
  // 默认模型
  const dmrow=document.createElement('div');dmrow.className='crow';
  const dmlb=document.createElement('label');dmlb.textContent='默认模型';
  if(p.models.length){const dms=document.createElement('select');dms.dataset.f='__dm';
    p.models.forEach(m=>{const o=document.createElement('option');o.value=m||'';o.textContent=m||'(默认)';
      if(m===p.default_model)o.selected=1;dms.appendChild(o);});dmrow.append(dmlb,dms);}
  else{const dmi=document.createElement('input');dmi.dataset.f='__dm';dmi.placeholder=p.default_model||'模型名';dmrow.append(dmlb,dmi);}
  pb.appendChild(dmrow);
  // 启用开关
  const erow=document.createElement('div');erow.className='crow';
  const elb=document.createElement('label');elb.textContent='启用';
  const sw=document.createElement('span');sw.className='switch';
  const ck=document.createElement('input');ck.type='checkbox';ck.checked=!!p.enabled;
  const sl=document.createElement('span');sl.className='sl';sw.append(ck,sl);
  erow.append(elb,sw);pb.appendChild(erow);
  // 按钮
  const foot=document.createElement('div');foot.className='pfoot';
  const sv=document.createElement('button');sv.className='btn primary';sv.textContent='保存配置';
  sv.onclick=()=>saveP(p.name,c,ck);
  const ts=document.createElement('button');ts.className='btn selftest';ts.textContent='自检';
  ts.onclick=async()=>{const r=await(await apiFetch('/v1/providers/'+p.name+'/test',{method:'POST'})).json();
    showProv('自检：'+(r.available?'可用 ✓':'不可用 '+(r.missing.join(',')||''))+(r.cooldown_left?' 冷却'+r.cooldown_left+'s':''),r.available);};
  foot.append(sv,ts);
  c.append(ph,pb,foot);return c;
}
async function saveP(name,card,ck){
  const vals={enabled:ck.checked};
  card.querySelectorAll('input[data-f],select[data-f]').forEach(x=>{
    if(x.dataset.f==='__dm'){if(x.value)vals.default_model=x.value;}
    else if(x.value)vals[x.dataset.f]=x.value;
  });
  showProv('保存中…',1);
  const r=await apiFetch('/v1/providers/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({updates:{[name]:vals}})});
  const j=await r.json();
  if(!r.ok){showProv('保存失败：'+(j.error&&j.error.message),0);return;}
  showProv('已保存并热加载 ✓',1);loadProviders();refreshGlobal();
}
function showProv(t,ok){$('provMsg').innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+t+'</div>';}

/* ---------------- 通用 ---------------- */
function openLb(s){$('lbImg').src=s;$('lightbox').style.display='flex';}
$('lightbox').onclick=()=>$('lightbox').style.display='none';
function fmtT(t){return new Date(t*1000).toLocaleString('zh-CN',{hour12:false});}
function deb(f,m){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),m);};}

/* ---------------- 接入方与日志 ---------------- */
async function loadClients(){
  const j=await(await apiFetch('/v1/clients')).json();
  const box=$('cliCards');box.innerHTML='';
  $('cliCount').textContent='共 '+j.data.length+' 个接入方';
  if(!j.data.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">暂无调用记录</div>';return;}
  j.data.forEach(c=>{
    const d=document.createElement('div');d.className='stat '+(c.online?'s1':'s2');
    d.innerHTML='<div class="n">'+c.count+'</div>'+
      '<div class="t" style="font-weight:650;color:#1f2937">'+esc(c.client)+
      ' <span class="dot '+(c.online?'g':'a')+'"></span></div>'+
      '<div class="t">成功率 '+c.success_rate+'% · 最近 '+fmtT(c.last_ts)+'</div>'+
      '<div class="t">'+(c.trusted?'<span style="color:#15803d;font-weight:650">🔒 可信接入方</span>':'<span style="color:#b45309;font-weight:650">⚠ 自报名（可伪造）</span>')+'</div>'+
      '<div class="t">'+c.transports.map(function(t){return '<span class="tbadge '+t+'">'+t+'</span>';}).join(' ')+'</div>';
    box.appendChild(d);
  });
  // 同步接入方下拉
  const sel=$('logClient');const cur=sel.value;
  sel.innerHTML='<option value="">全部接入方</option>';
  j.data.forEach(c=>{const o=document.createElement('option');o.value=c.client;o.textContent=c.client;sel.appendChild(o);});
  sel.value=cur;
}
async function loadUsage(){
  const p=new URLSearchParams();
  if($('logClient').value)p.set('client',$('logClient').value);
  if($('logTransport').value)p.set('transport',$('logTransport').value);
  if($('logAction').value)p.set('action',$('logAction').value);
  if($('logSearch').value)p.set('search',$('logSearch').value);
  p.set('limit', $('logLimit').value || 300);
  const j=await(await apiFetch('/v1/usage?'+p.toString())).json();
  const box=$('logTable');
  if(!j.total){box.innerHTML='<div class="empty">没有匹配日志</div>';return;}
  let h='<table class="logtable"><thead><tr>'+
    '<th>时间</th><th>接入方</th><th>通道</th><th>动作</th><th>渠道</th>'+
    '<th>会话</th><th>状态</th><th>耗时</th><th>prompt</th></tr></thead><tbody>';
  j.data.forEach(r=>{
    h+='<tr><td>'+fmtT(r.ts)+'</td><td style="font-weight:650">'+esc(r.client)+'</td>'+
      '<td><span class="tbadge '+(r.transport||'')+'">'+(r.transport||'-')+'</span></td>'+
      '<td>'+(r.action||'-')+'</td><td>'+(r.provider||'-')+'</td>'+
      '<td>'+(r.session_id||'-')+'</td>'+
      '<td class="'+(r.status==='success'?'st-ok':'st-fail')+'">'+(r.status==='success'?'成功':'失败')+'</td>'+
      '<td>'+(r.duration_ms?r.duration_ms+'ms':'-')+'</td>'+
      '<td class="prompt" title="'+esc(r.prompt||'')+'">'+esc(r.prompt||'')+'</td></tr>';
  });
  h+='</tbody></table>';
  box.innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
['logClient','logTransport','logAction'].forEach(function(id){$(id).onchange=loadUsage;});
$('logLimit').onchange=loadUsage;
$('logSearch').oninput=deb(loadUsage,300);
$('logRefresh').onclick=function(){loadClients();loadUsage();};
let _logAutoTimer=null;
$('logAutoRefresh').onchange=function(){
  if(this.checked){
    loadUsage();
    _logAutoTimer=setInterval(loadUsage,10000);
  }else if(_logAutoTimer){
    clearInterval(_logAutoTimer);_logAutoTimer=null;
  }
};
$('logClear').onclick=function(){$('logTable').innerHTML='<div class="empty">已清空显示（不删除服务端日志）</div>';};
$('adminTokenInput').addEventListener('input', function(){
  if(this.value.trim()) localStorage.setItem('imgw_admin_token', this.value.trim());
  else localStorage.removeItem('imgw_admin_token');
});
$('adminTokenInput').addEventListener('change', function(){
  // token 变更后刷新当前视图数据
  var active = document.querySelector('.view.on');
  if(!active) return;
  var id = active.id;
  if(id === 'view-clients'){ loadClients(); loadUsage(); }
  else if(id === 'view-history'){ loadHistory(); }
  else if(id === 'view-providers'){ loadProviders(); }
});

init();
