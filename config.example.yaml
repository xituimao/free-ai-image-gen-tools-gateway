# ============================================================
# Unified Image Gateway Configuration —— Copy to config.yaml and fill as needed
# All api_key can also be omitted here, use same-named environment variables, e.g., GEMINI_API_KEY
# ============================================================

server:
  # Keep 127.0.0.1 for local use; change to 0.0.0.0 when deploying to cloud server for external access
  # (Remember to open the port in the cloud host's security group and be sure to set the admin_token below)
  host: 127.0.0.1
  port: 8799
  # Default call chain: when no provider is specified in the request, try in this order, return on first success
  # Put free channels first, paid/key-required as fallback
  default_chain:
    - pollinations
    - gemini
    - siliconflow
    - bailian
  # Single channel read timeout (seconds); connection timeout fixed at 15s. Increase if ZeroGPU cold start queue is slow
  timeout: 120
  # Unified resource directory: all generated/uploaded images are stored here by session (storage/sessions/<session>/).
  # Can write relative path (relative to project root) or absolute path; on cloud, recommend pointing to a mounted data disk, e.g., /data/imgw
  storage_dir: storage
  # Authentication token for management interface /admin/reload (also can use environment variable ADMIN_TOKEN).
  # If left empty, only allow local loopback calls; when host is changed to 0.0.0.0 for external access, strongly recommend setting.
  admin_token: ""
  # External base URL used for returning absolute image addresses. If left empty, auto-detect (including reverse proxy X-Forwarded-*).
  # Can be explicitly specified when accessing via domain/HTTPS externally or when auto-detection is incorrect, e.g., https://img.yourdomain.com
  public_base_url: ""
  # When using Nginx or other reverse proxies, need to let uvicorn trust which sources' proxy headers;
  # On cloud, can set to "*" for full network access; for local direct connection, keep 127.0.0.1
  forwarded_allow_ips: 127.0.0.1

providers:

  # ---------- 1. Completely free, no key required (fallback channel, ready to use) ----------
  pollinations:
    enabled: true
    base_url: https://image.pollinations.ai
    model: sana            # Anonymous free tier current model
    # Available parameters: width / height / seed / nologo

  # ---------- 2. Google Gemini (AI Studio free key, Nano Banana) ----------
  # Free application: https://aistudio.google.com/apikey (free tier has daily quota)
  gemini:
    enabled: false
    api_key: ""
    model: gemini-2.5-flash-image
    base_url: https://generativelanguage.googleapis.com/v1beta

  # ---------- 3. OpenAI-compatible protocol channels (one protocol, can configure multiple) ----------
  # Each sub-item is an independent channel: SiliconFlow / OpenAI official / third-party forwarder …
  openai_compatible:

    siliconflow:
      enabled: false
      base_url: https://api.siliconflow.cn/v1
      api_key: ""                        # Environment variable SILICONFLOW_API_KEY
      default_model: black-forest-labs/FLUX.2-flex
      models:
        - black-forest-labs/FLUX.2-flex
        - Tongyi-MAI/Z-Image-Turbo
        - Kwai-Kolors/Kolors

    openai:
      enabled: false
      base_url: https://api.openai.com/v1
      api_key: ""                        # Environment variable OPENAI_API_KEY
      default_model: gpt-image-1
      models:
        - gpt-image-1

    # Third-party low-cost forwarder example (replace address/key as needed, discern stability)
    relay:
      enabled: false
      base_url: "https://your-relay-host/v1"
      api_key: ""
      default_model: gpt-image-1
      models:
        - gpt-image-1

  # ---------- 4. Alibaba Cloud Bailian DashScope (Tongyi Wanxiang / Z-Image) ----------
  # Console https://bailian.console.aliyun.com/ to get key
  bailian:
    enabled: false
    api_key: ""
    base_url: https://dashscope.aliyuncs.com/api/v1
    default_model: wanx2.1-t2i-turbo
    models:
      - wanx2.1-t2i-turbo
      - wanx2.1-t2i-plus
      - z-image-turbo

  # ---------- 5. HuggingFace Spaces (free, run open-source models in the cloud) ----------
  # Preloaded common Space presets; domestic access to huggingface requires network connectivity
  hf_space:
    enabled: true
    default_space: flux_schnell
    # ZeroGPU-type Spaces have daily free second quota for anonymous; fill in free HF token to get more quota
    # Application: https://huggingface.co/settings/tokens (also can use environment variable HF_TOKEN)
    hf_token: ""
    # Also customize any Gradio Space (need to know its api_name and parameter order):
    custom_spaces: []
    # - name: my_space
    #   space: user-name/space-name
    #   api_name: /predict
    #   param_order: [prompt, seed, width, height]

  # ---------- 6. Perchance (free reverse, best effort, may change with official site) ----------
  perchance:
    enabled: true

  # ---------- 7. Bing Image Creator (DALL-E 3, requires account cookie) ----------
  # After logging in to https://www.bing.com in the browser, copy the value of _U from the cookie
  bing:
    enabled: false
    cookie_u: ""
